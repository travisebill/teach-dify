name: Deploy teach-dify to GitHub Pages

# 觸發條件
# 1. push to main（任何 commit 都會 deploy）
# 2. workflow_dispatch（手動 trigger，從 Actions tab 點按鈕）
on:
  push:
    branches: [main]
  workflow_dispatch:

# 必要權限（AGENTS.md 永久教訓：含 'repo' + 'workflow' scope）
permissions:
  contents: write
  deployments: read
  statuses: read

# Concurrency control：避免同時多次 deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Push main to gh-pages branch + verify
    runs-on: ubuntu-latest

    steps:
      # 1. checkout（含完整 history 才能用 git push）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup git config（push 需要 user.name / user.email）
      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. Force push main → gh-pages branch
      # Pages Settings 設成 "Deploy from a branch: gh-pages"，
      # 這個 workflow 把 main 的內容推到 gh-pages，Pages 自動 build + serve。
      - name: Force push main to gh-pages branch
        id: push
        run: |
          git push origin HEAD:gh-pages --force
          echo "✓ main branch content pushed to gh-pages branch"

      # 4. Verify step（AGENTS.md 永久教訓：等 Pages 真 build 完 + fetch 驗證）
      # - 30s 等 Pages build gh-pages
      # - fetch 網站確認 HTTP 200
      # - fetch lesson 1 HTML 確認內容（grep "Lesson 0001"）
      # - fetch CSS 確認 asset pipeline OK
      - name: Verify Pages deployment
        uses: actions/github-script@v7
        timeout-minutes: 8
        with:
          script: |
            const SITE = 'https://travisebill.github.io/teach-dify/';
            const LESSON = SITE + 'lessons/0001-self-host-and-hello-world-chatbot.html';
            const CSS = SITE + 'assets/style.css';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // --- A. 等 30s 讓 Pages build gh-pages ---
            core.info('[verify] waiting 30s for Pages to build gh-pages branch...');
            await sleep(30000);

            // --- B. fetch 網站確認 HTTP 200 ---
            core.info(`[verify] GET ${SITE}`);
            const resp = await fetch(SITE, { redirect: 'manual' });
            const status = resp.status;
            core.info(`[verify] site HTTP ${status}`);
            if (status < 200 || status >= 400) {
              core.setFailed(`[verify] ❌ ${SITE} HTTP ${status}`);
              return;
            }

            // --- C. fetch lesson 1 確認內容 ---
            core.info(`[verify] GET ${LESSON}`);
            const lr = await fetch(LESSON, { redirect: 'manual' });
            if (!lr.ok) {
              core.setFailed(`[verify] ❌ lesson 1 HTTP ${lr.status}`);
              return;
            }
            const lessonBody = await lr.text();
            core.info(`[verify] lesson 1 OK (${lessonBody.length} bytes)`);
            if (!lessonBody.includes('Lesson 0001') || !lessonBody.includes('Self-host')) {
              core.setFailed(`[verify] ❌ lesson 1 body missing expected content`);
              return;
            }

            // --- D. fetch CSS 確認 asset pipeline ---
            core.info(`[verify] GET ${CSS}`);
            const cssR = await fetch(CSS, { redirect: 'manual' });
            if (!cssR.ok) {
              core.setFailed(`[verify] ❌ CSS HTTP ${cssR.status}`);
              return;
            }
            const cssBody = await cssR.text();
            core.info(`[verify] CSS OK (${cssBody.length} bytes)`);

            // --- E. 全部 OK ---
            core.info(`[verify] ✅ ${SITE} reachable, lesson 1 OK, CSS OK`);
            core.summary.addRaw(
              '# teach-dify Pages Deployment Verified ✅\n\n' +
              `- Site: ${SITE}\n` +
              `- HTTP: ${status}\n` +
              `- Method: git push origin HEAD:gh-pages --force\n` +
              `- Trigger: main branch push / workflow_dispatch`
            ).write();
